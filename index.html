  <style>
    :root {
      --sky: #b8e1f7;
      --yellow: #f8cb45;
      --paper: #fffdf7;
      --ink: #202020;
      --green: #67d166;
      --orange: #ffb530;
      --purple: #d4c1ec;
      --coral: #ee675c;
      --blue: #70cbe9;
      --muted: #8a8a8a;
      --outline: 3px solid var(--ink);
      --shadow: 0 4px 0 var(--ink);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sky);
      color: var(--ink);
      font-family: "Space Mono", monospace;
      padding: 20px 14px 36px;
      background-image: radial-gradient(rgba(32,32,32,.08) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    .app { width: min(880px, 100%); margin: 0 auto; }

    .brandbar {
      min-height: 58px;
      background: var(--yellow);
      border: var(--outline);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 8px 15px;
      margin-bottom: 12px;
    }
    .brand { font-family: "Bungee", sans-serif; font-size: clamp(1.1rem, 4vw, 1.55rem); letter-spacing: .05em; }
    .mini-display { font-size: .62rem; letter-spacing: .1em; text-align: centre; text-align: center; font-weight: 700; }
    .sound-button {
      justify-self: end;
      background: var(--ink);
      color: var(--paper);
      width: 35px; height: 35px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: grid; place-items: center;
      cursor: pointer;
      padding: 6px;
    }
    .sound-button svg { width: 20px; height: 20px; }
    .sound-button.muted { background: var(--paper); color: var(--ink); }

    .panel {
      background: var(--paper);
      border: var(--outline);
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin: 12px 0;
      overflow: hidden;
    }

    .now-panel { padding: 13px; }
    .now-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
    .kicker { font-family: "Bungee", sans-serif; font-size: .68rem; letter-spacing: .06em; }
    .track { margin-top: 4px; font-size: .64rem; letter-spacing: .1em; color: #565656; }
    .bpm-box { border: 2px solid var(--ink); background: var(--green); border-radius: 9px; padding: 6px 10px; text-align: center; min-width: 64px; }
    .bpm-box b { display: block; font-family: "Bungee", sans-serif; font-size: 1.1rem; line-height: 1; }
    .bpm-box span { display: block; font-size: .48rem; font-weight: 700; margin-top: 3px; }
